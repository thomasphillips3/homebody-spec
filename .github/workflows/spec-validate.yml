name: spec-validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Regenerate schema artifacts
        run: |
          npm run bundle-schema
          npm run codegen

      - name: Check generated artifact drift
        run: |
          if [ -n "$(git status --short -- generated)" ]; then
            git status --short -- generated
            echo "Generated code is stale - run npm run bundle-schema and npm run codegen"
            exit 1
          fi

      - name: Test validator, references, versions, and npm package
        run: npm test

      - name: Build Swift package in Release
        run: swift build -c release

      - name: Run external Swift consumer in Release
        run: swift run -c release --package-path tests/swift-consumer

      - name: Verify Gradle wrapper JAR
        run: |
          echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  gradle/wrapper/gradle-wrapper.jar" |
            sha256sum --check -

      - name: Build Gradle package
        run: ./gradlew build --no-daemon
